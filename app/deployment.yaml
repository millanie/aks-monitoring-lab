##############################################################################
# Sample App: Kubernetes manifests for AKS monitoring demo
##############################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    monitoring: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: demo-app
  labels:
    app: sample-app
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
        version: v1
      annotations:
        # ama-metrics가 자동 스크래핑하도록 설정
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sample-app
          image: ACR_LOGIN_SERVER_PLACEHOLDER/sample-app:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: demo-app
  labels:
    app: sample-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: sample-app
---
# PodMonitor: Managed Prometheus가 커스텀 메트릭을 스크래핑하도록 명시적 설정
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: sample-app-monitor
  namespace: demo-app
spec:
  selector:
    matchLabels:
      app: sample-app
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
---
# ama-metrics custom scrape config (ConfigMap for additional scrape targets)
apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-prometheus-config
  namespace: kube-system
data:
  prometheus-config: |
    scrape_configs:
      - job_name: 'demo-app'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - demo-app
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
